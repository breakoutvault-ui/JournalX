<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>JournalX — Trading Journal</title>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<style>

:root{--bg:#0a0d14;--bg2:#0f1420;--bg3:#151c2c;--bg4:#1c2438;--border:#232d42;--border2:#2d3a54;--text:#e8edf5;--text2:#8b97b0;--text3:#4a5568;--accent:#3b82f6;--accent2:#6366f1;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--purple:#8b5cf6;--cyan:#06b6d4;--orange:#f97316;--card:#111827;--r:10px;--rs:6px;}
[data-theme="light"]{--bg:#f0f4ff;--bg2:#fff;--bg3:#f8faff;--bg4:#eef2ff;--border:#dde3f0;--border2:#c8d0e8;--text:#111827;--text2:#4b5563;--text3:#9ca3af;--card:#fff;}
[data-theme="midnight"]{--bg:#060818;--bg2:#0a0f28;--bg3:#0f1535;--bg4:#141d45;--border:#1a2550;--border2:#243070;--text:#c8d8ff;--text2:#7a90cc;--text3:#3a4a7a;--accent:#4f8ef7;--green:#00d4a0;--red:#ff4d6a;--yellow:#ffb930;--card:#0c1230;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
#app{display:flex;flex-direction:column;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:54px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.logo{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px;}
.tr{display:flex;align-items:center;gap:8px;}
.tabs{display:flex;padding:0 20px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;gap:2px;}
.tab{padding:11px 14px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.main{flex:1;padding:20px;max-width:1500px;margin:0 auto;width:100%;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.mc{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;border-top:2px solid var(--accent);}
.ml{font-size:10px;color:var(--text3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.mv{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;}
.cw{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:18px;}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.ct{font-size:14px;font-weight:600;}
.pb{display:flex;gap:4px;flex-wrap:wrap;}
.pbtn{padding:4px 9px;font-size:11px;font-weight:600;border-radius:4px;cursor:pointer;background:transparent;border:1px solid var(--border2);color:var(--text2);transition:all .15s;}
.pbtn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tw{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:14px;}
.tt{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap;}
.sb{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:6px 10px;flex:1;min-width:130px;}
.sb input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;width:100%;font-family:'Manrope',sans-serif;}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:8px 9px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg3);white-space:nowrap;}
td{font-size:12px;padding:8px 9px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
.tov{overflow-x:auto;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:'Manrope',sans-serif;}
.btn-p{background:var(--accent);color:#fff;}
.btn-p:hover{background:#2563eb;}

.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border2);}
.btn-g:hover{background:var(--bg3);}
.btn-gr{background:rgba(16,185,129,.12);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.btn-r{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.btn-sm{padding:4px 9px;font-size:11px;}
.btn-xs{padding:2px 6px;font-size:10px;}
.ib{width:26px;height:26px;border-radius:5px;border:1px solid var(--border2);background:var(--bg3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);font-size:12px;transition:all .15s;}
.ib:hover{border-color:var(--accent);color:var(--accent);}
.ib.del:hover{border-color:var(--red);color:var(--red);}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.mod{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;}

.mh{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg2);z-index:10;}
.mt{font-size:15px;font-weight:700;}
.mc2{width:26px;height:26px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:15px;}
.mb{padding:18px 20px;}
.mf{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--bg2);}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ff{grid-column:1/-1;}
.f{display:flex;flex-direction:column;gap:4px;}
.f label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;}
.f input,.f select,.f textarea{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:7px 9px;font-size:13px;color:var(--text);font-family:'Manrope',sans-serif;outline:none;transition:border-color .15s;}

.bdg{display:inline-flex;align-items:center;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;}
.b-pr{background:rgba(16,185,129,.15);color:var(--green);}
.b-lo{background:rgba(239,68,68,.15);color:var(--red);}
.b-op{background:rgba(59,130,246,.15);color:var(--accent);}
.b-di{background:rgba(16,185,129,.12);color:var(--green);}
.b-in{background:rgba(239,68,68,.12);color:var(--red);}
.b-ne{background:rgba(245,158,11,.12);color:var(--yellow);}
.b-or{background:rgba(99,102,241,.15);color:var(--accent2);}
.cy{color:var(--green);}
.cn{color:var(--red);}
.es{padding:48px 16px;text-align:center;}
.ei{font-size:38px;margin-bottom:10px;opacity:.4;}
.et{font-size:14px;font-weight:600;color:var(--text2);margin-bottom:4px;}
.ec{font-size:12px;color:var(--text3);}
.fsel{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:5px 8px;font-size:12px;color:var(--text2);font-family:'Manrope',sans-serif;outline:none;cursor:pointer;}
.ab{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;gap:8px;font-size:12px;color:var(--text2);line-height:1.7;}
.ai-box{background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(59,130,246,.05));border:1px solid rgba(99,102,241,.2);border-radius:var(--r);padding:12px;font-size:12px;color:var(--text2);line-height:1.7;margin-top:10px;}
.ai-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);margin-bottom:5px;}
.ail{display:flex;align-items:center;gap:5px;color:var(--text3);font-size:12px;}
.ad{width:5px;height:5px;border-radius:50%;background:var(--accent2);animation:pulse 1s infinite;}
.ad:nth-child(2){animation-delay:.2s;}
.ad:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}
.qb{background:linear-gradient(135deg,rgba(99,102,241,.07),rgba(59,130,246,.04));border:1px solid rgba(99,102,241,.15);border-radius:var(--r);padding:12px 16px;margin-bottom:18px;display:flex;align-items:flex-start;gap:10px;}
.qb.loss{background:linear-gradient(135deg,rgba(239,68,68,.06),rgba(245,158,11,.03));border-color:rgba(239,68,68,.15);}
.qe{font-size:24px;flex-shrink:0;}
.qt{font-size:12px;color:var(--text2);line-height:1.7;font-style:italic;}
.qa{font-size:11px;color:var(--text3);font-weight:600;margin-top:4px;}
.hw{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:18px;}
.hg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.hdl{font-size:10px;font-weight:700;color:var(--text3);text-align:center;padding:3px 0;}
.hc{aspect-ratio:1;border-radius:3px;cursor:pointer;transition:transform .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
.hc:hover{transform:scale(1.1);z-index:2;}
.oc{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:18px;}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cdh{font-size:10px;font-weight:700;color:var(--text3);text-align:center;padding:3px 0;}
.cc{border-radius:var(--rs);padding:5px;min-height:52px;cursor:pointer;border:1px solid transparent;transition:all .15s;}
.cc:hover{border-color:var(--accent);}
.cc.emp{background:transparent;border:none;cursor:default;}
.cc.nt{background:var(--bg4);opacity:.5;cursor:default;}
.cc.nt:hover{border:1px solid transparent;}
.cd{font-size:10px;font-weight:700;color:var(--text3);margin-bottom:2px;}
.cp{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;}
.pw{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:18px;}
.pi{background:var(--bg4);border-radius:var(--rs);padding:9px 11px;font-size:12px;color:var(--text2);line-height:1.6;border-left:3px solid var(--border2);margin-bottom:7px;}
.pi.bullish{border-left-color:var(--green);}
.pi.bearish{border-left-color:var(--red);}
.pi.neutral{border-left-color:var(--yellow);}
.pi.alert{border-left-color:var(--purple);}
.pt{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;}
.ls-scr{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);flex-direction:column;gap:20px;padding:16px;}
.ls-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px 32px;width:100%;max-width:340px;box-shadow:0 16px 48px rgba(0,0,0,.4);}
.mbar{display:flex;flex-direction:column;gap:7px;}
.br{display:flex;align-items:center;gap:8px;font-size:12px;}
.bl{width:85px;color:var(--text2);white-space:nowrap;}
.bt{flex:1;height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;}
.bf{height:100%;border-radius:3px;}
.bv{width:50px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text2);}
.sd{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px;}
.sd-w{width:11px;height:11px;border-radius:2px;background:var(--green);}
.sd-l{width:11px;height:11px;border-radius:2px;background:var(--red);}
.sd-o{width:11px;height:11px;border-radius:2px;background:var(--bg4);}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.cb{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.22);border-radius:var(--r);padding:9px 13px;display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;}
.ts{display:flex;gap:2px;margin-bottom:16px;background:var(--bg3);border-radius:var(--r);padding:3px;width:fit-content;}
.tsbtn{padding:7px 16px;border-radius:var(--rs);border:none;cursor:pointer;font-size:13px;font-weight:600;background:transparent;color:var(--text2);transition:all .15s;font-family:'Manrope',sans-serif;}
.tsbtn.active{background:var(--accent);color:#fff;}
.dfb{display:flex;gap:7px;flex-wrap:wrap;}
.dfbtn{flex:1;min-width:80px;padding:7px 8px;border-radius:var(--rs);border:2px solid var(--border2);cursor:pointer;text-align:center;font-size:12px;font-weight:600;transition:all .15s;}
.upload-box{position:relative;border:2px dashed var(--border2);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:all .15s;}
.upload-box:hover{border-color:var(--accent);}
.upload-box input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.thsw{display:flex;gap:2px;background:var(--bg4);border:1px solid var(--border);border-radius:7px;padding:3px;}
.thbtn{width:25px;height:25px;border-radius:4px;border:none;cursor:pointer;background:transparent;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.thbtn.active{background:var(--accent);}
.rule-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;border-left:3px solid var(--accent);margin-bottom:7px;}
.itab{display:flex;gap:5px;margin-bottom:12px;}
.itabbtn{flex:1;padding:7px;border-radius:var(--rs);border:1px solid var(--border2);cursor:pointer;font-size:12px;font-weight:600;text-align:center;transition:all .15s;background:transparent;color:var(--text2);}
.itabbtn.active{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.07);}
.ci{display:flex;align-items:center;gap:6px;padding:7px 9px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;transition:all .15s;margin-bottom:5px;}
.ci.chk{border-color:var(--green);background:rgba(16,185,129,.06);}
.ci span{font-size:12px;color:var(--text2);}
.ci.chk span{color:var(--green);}
.stp{display:flex;align-items:center;margin-bottom:18px;}
.st{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;}
.st.act{color:var(--accent);}
.st.dn{color:var(--green);}
.sn{width:21px;height:21px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.st.act .sn{border-color:var(--accent);background:rgba(59,130,246,.12);color:var(--accent);}
.st.dn .sn{border-color:var(--green);background:rgba(16,185,129,.12);color:var(--green);}
.sl{flex:1;height:1px;background:var(--border);margin:0 7px;}
.pl-p{color:var(--green);font-weight:600;font-family:'IBM Plex Mono',monospace;}
.pl-n{color:var(--red);font-weight:600;font-family:'IBM Plex Mono',monospace;}

.mn{font-family:'IBM Plex Mono',monospace;}

</style>

<body>
<div id="root"></div>
<script>
// JournalX - Plain JavaScript (no JSX, no Babel)
const h = React.createElement;
const {useState, useEffect, useMemo, useRef} = React;

// ── DATA ──
const APP_PW = 'journalx2024';
const BROKERS = ['Zerodha','Groww','Dhan','Upstox'];
const PEOPLE = ['Mahesh','Friend 1','Friend 2'];
const EMOTIONS = ['Confident','Focused','Calm','Excited','Nervous','FOMO','Greedy','Fearful','Happy','Frustrated'];
const EQ_ENTRY = ['Breakout 52W/ATH','Sector Rotation','Momentum','EMA Retracement','Above High of Pullback','Random'];
const EXIT_TYPES = ['SL Triggered','Target Hit','Trailing SL','Broken 9EMA Profit','Broken 9EMA Loss','Manual Exit'];
const INSTRUMENTS = ['BankNifty','Nifty','FinNifty','MidcapNifty','Others'];
const MOVE_TYPES = ['Trending Up','Trending Down','Range Bound','Gap Up & Hold','Gap Down & Hold','Reversal','Choppy','Inside Bar Day'];
const DAY_FLAGS = [{v:'bullish',l:'Bullish',e:'🟢',c:'#10b981'},{v:'bearish',l:'Bearish',e:'🔴',c:'#ef4444'},{v:'choppy',l:'Choppy',e:'🟡',c:'#f59e0b'},{v:'sideways',l:'Sideways',e:'⚪',c:'#6b7280'}];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS_S = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const RULE_CATS = ['Entry','Exit','Risk','Psychology','Setup Filter','Kill Switch'];
const CAT_COLOR = {Entry:'var(--accent)',Exit:'var(--cyan)',Risk:'var(--red)',Psychology:'var(--purple)','Setup Filter':'var(--orange)','Kill Switch':'var(--red)'};

// ── SUPABASE ──
let supa = null;
const SUPA_URL = 'https://tsgltaqbxtisebqmbffg.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzZ2x0YXFieHRpc2VicW1iZmZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NTEyMDEsImV4cCI6MjA5MTEyNzIwMX0.SQGq9E67S7j977RUA-oJqDGV8KgEhQZb0nHfAvHcFys';
function initSupa() {
  // Always use hardcoded credentials
  localStorage.setItem('supa_url', SUPA_URL);
  localStorage.setItem('supa_key', SUPA_KEY);
  supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  return true;
}
const TBL = {equity:'equity_trades',options:'options_trades',us:'us_trades'};
async function dbLoad(type) {
  if (!supa) return null;
  const {data, error} = await supa.from(TBL[type]).select('*').order('created_at',{ascending:false});
  if (error) { console.error(error); return null; }
  return data;
}
async function dbSave(type, row) {
  if (!supa) return;
  const {id, ...rest} = row;
  if (!id || String(id).length < 10) { const {data} = await supa.from(TBL[type]).insert([rest]).select(); return data&&data[0]; }
  await supa.from(TBL[type]).upsert([row]); return row;
}
async function dbDel(type, id) { if (!supa) return; await supa.from(TBL[type]).delete().eq('id',id); }

// ── HELPERS ──
const fmt = n => n==null ? '—' : (n>=0?'+':'') + '₹' + Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:0});
const fmtUSD = n => n==null ? '—' : (n>=0?'+':'-') + '$' + Math.abs(n).toFixed(2);
const el = (tag, props, ...ch) => h(tag, props, ...ch);
const div = (cls, props, ...ch) => h('div', {className:cls,...props}, ...ch);
const span = (cls, props, ...ch) => h('span', {className:cls,...props}, ...ch);
const btn = (cls, props, ...ch) => h('button', {className:cls,...props}, ...ch);

function filterByPeriod(trades, period, cs, ce) {
  const now = new Date(), dateOf = t => new Date(t.sell_date||t.buy_date);
  if (period==='ALL') return trades;
  if (period==='CUSTOM'&&cs&&ce) { const s=new Date(cs),e=new Date(ce); return trades.filter(t=>{const d=dateOf(t);return d>=s&&d<=e;}); }
  if (period==='YTD') { const j=new Date(now.getFullYear(),0,1); return trades.filter(t=>dateOf(t)>=j); }
  const days={M1:30,M3:90,M6:180}[period];
  if (!days) return trades;
  const cut = new Date(now-days*86400000);
  return trades.filter(t=>dateOf(t)>=cut);
}

const CLAUDE_API_KEY = localStorage.getItem('claude_api_key') || '';
async function callClaude(prompt, maxTok) {

    method:'POST', headers:{'Content-Type':'application/json','x-api-key':CLAUDE_API_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},

}

// ── BULK CSV PARSER (Zerodha FO + EQ) ──
function parseSymbolFO(sym) {
  if (!sym) return {};
  const m = sym.match(/^([A-Z]+?)\d{2}([A-Z]{3})(\d+)(CE|PE)$/);
  if (m) return {stock:m[1], expiry_month:m[2], strike:parseInt(m[3]), option_type:m[4]};
  return {stock:sym};
}

function parseFullZerodhaCsv(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  if (lines.length < 2) return [];

  // Find header row
  let headerIdx = -1;
  for (let i = 0; i < lines.length; i++) {
    const lower = lines[i].toLowerCase();
    if (lower.includes('symbol') && lower.includes('trade type')) { headerIdx = i; break; }
    if (lower.includes('trade date') && lower.includes('quantity')) { headerIdx = i; break; }
  }
  if (headerIdx < 0) headerIdx = 0;

  const headers = lines[headerIdx].split(',').map(h => h.trim().replace(/"/g,'').toLowerCase());
  const dataLines = lines.slice(headerIdx + 1).filter(l => l && l.replace(/,/g,'').trim());

  const getCol = (row, ...names) => {
    for (const n of names) {
      const idx = headers.findIndex(h => h.includes(n));
      if (idx >= 0 && row[idx] !== undefined) return (row[idx]||'').trim().replace(/"/g,'');
    }
    return '';
  };

  const rows = dataLines.map(l => l.split(',').map(c => c.trim().replace(/"/g,'')));

  // Group by symbol, keeping chronological order
  const bySymbol = {};
  rows.forEach(r => {
    const sym = getCol(r, 'symbol', 'scrip', 'instrument', 'stock');
    if (!sym || sym.length < 2) return;
    if (!bySymbol[sym]) bySymbol[sym] = {buys:[], sells:[]};
    const tradeType = getCol(r, 'trade type', 'type', 'action', 'transaction').toLowerCase();
    const qty = parseFloat(getCol(r, 'quantity', 'qty')) || 0;
    const price = parseFloat(getCol(r, 'price', 'avg price', 'average price')) || 0;
    const date = getCol(r, 'trade date', 'date', 'order date').slice(0,10).replace(/\//g,'-');
    const timeRaw = getCol(r, 'order execution time', 'execution time', 'time');
    const timeStr = timeRaw.length > 10 ? timeRaw.slice(11,16) : timeRaw.slice(0,5);
    if (tradeType.includes('buy')) bySymbol[sym].buys.push({qty,price,date,time:timeStr});
    else if (tradeType.includes('sell')) bySymbol[sym].sells.push({qty,price,date,time:timeStr});
  });

  // Pair each buy with corresponding sell chronologically = one trade per pair
  const trades = [];
  Object.entries(bySymbol).forEach(([sym, {buys, sells}]) => {
    const parsed = parseSymbolFO(sym);
    const pairs = Math.min(buys.length, sells.length);
    for (let i = 0; i < pairs; i++) {
      const b = buys[i], s = sells[i];
      const pl = (s.price - b.price) * b.qty;
      trades.push({
        stock: parsed.stock || sym,
        option_type: parsed.option_type || 'CE',
        strike: parsed.strike || null,
        expiry_month: parsed.expiry_month || '',
        quantity: b.qty,
        buy_price: b.price,
        sell_price: s.price,
        buy_date: b.date,
        sell_date: s.date,
        buy_time: b.time,
        sell_time: s.time,
        gross_pl: Math.round(pl * 100) / 100,
        net_pl: Math.round(pl * 0.95 * 100) / 100,
        trade_result: pl >= 0 ? 'PROFIT' : 'LOSS',
        broker: 'Zerodha', person: 'Mahesh',
        trade_rating: 'DISCIPLINED', setup_type: 'ORB'
      });
    }
    // Any unmatched buys = open positions
    if (buys.length > sells.length) {
      for (let i = sells.length; i < buys.length; i++) {
        const b = buys[i];
        trades.push({
          stock: parsed.stock || sym,
          option_type: parsed.option_type || 'CE',
          strike: parsed.strike || null,
          expiry_month: parsed.expiry_month || '',
          quantity: b.qty, buy_price: b.price, sell_price: null,
          buy_date: b.date, sell_date: null, buy_time: b.time, sell_time: '',
          gross_pl: null, net_pl: null, trade_result: 'OPEN',
          broker: 'Zerodha', person: 'Mahesh',
          trade_rating: 'DISCIPLINED', setup_type: 'ORB'
        });
      }
    }
  });
  return trades;
}

function EquityCurve({trades, colorKey, height, period, cs, ce}) {
  const ht = height||200;

    const pt = filterByPeriod(trades||[], period||'ALL', cs, ce);

    const sr = [...ex].sort((a,b)=>new Date(a.sell_date||a.buy_date)-new Date(b.sell_date||b.buy_date));
    let cum=0;
    return sr.map(t=>({val:(cum+=t.net_pl), date:t.sell_date||t.buy_date, stock:t.stock||t.ticker, pl:t.net_pl}));
  }, [trades,period,cs,ce]);
  if (data.length<2) return div(null,{style:{height:ht,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)',fontSize:13}},'Not enough data for period');

// ── DISCIPLINE ANALYTICS SECTION ──
function DisciplineAnalytics({optTrades}) {
  const closed = optTrades.filter(t => t.net_pl != null);
  if (!closed.length) return null;

  // Rule compliance per checklist item
  const checks = [
    {key:'orb_gt_30_datr', label:'ORB > 30% ATR'},
    {key:'traded_from_watchlist', label:'Watchlist Only'},
    {key:'traded_after_bo_candle', label:'After BO Candle'},
    {key:'traded_after_15mins', label:'Waited 15 Mins'},
    {key:'ema_aligned', label:'EMA Aligned'},
    {key:'index_aligned', label:'Index Aligned'},
    {key:'not_xxl_candle', label:'Not XXL Candle'},
  ];

  const stats = checks.map(c => {
    const followed = closed.filter(t => t[c.key]);
    const bypassed = closed.filter(t => !t[c.key]);
    const followedPL = followed.length ? followed.reduce((a,t)=>a+(t.net_pl||0),0)/followed.length : 0;
    const bypassedPL = bypassed.length ? bypassed.reduce((a,t)=>a+(t.net_pl||0),0)/bypassed.length : 0;
    const followRate = closed.length ? (followed.length/closed.length*100) : 0;
    return {...c, followed:followed.length, bypassed:bypassed.length, followRate, followedPL, bypassedPL, impact:followedPL-bypassedPL};
  });

  const sortedByBypass = [...stats].sort((a,b) => a.followRate - b.followRate);
  const sortedByFollowed = [...stats].sort((a,b) => b.followRate - a.followRate);

  const disc = closed.filter(t => t.trade_rating==='DISCIPLINED');
  const indisc = closed.filter(t => t.trade_rating==='INDISCIPLINED');
  const fomoTrades = closed.filter(t => t.fomo_entry);
  const fearTrades = closed.filter(t => t.fear_exit);
  const discPL = disc.length ? disc.reduce((a,t)=>a+(t.net_pl||0),0)/disc.length : 0;
  const indiscPL = indisc.length ? indisc.reduce((a,t)=>a+(t.net_pl||0),0)/indisc.length : 0;
  const fomoPL = fomoTrades.length ? fomoTrades.reduce((a,t)=>a+(t.net_pl||0),0)/fomoTrades.length : 0;
  const fearPL = fearTrades.length ? fearTrades.reduce((a,t)=>a+(t.net_pl||0),0)/fearTrades.length : 0;

  const overallCompliance = stats.reduce((a,s)=>a+s.followRate,0)/stats.length;

  return div(null, null,
    // Overall compliance score
    div('card', {style:{marginBottom:14}},
      div('ml', {style:{marginBottom:12}}, 'Discipline Score'),
      div(null, {style:{display:'flex',gap:14,flexWrap:'wrap',alignItems:'center'}},
        div(null, {style:{textAlign:'center'}},
          div(null, {style:{fontFamily:'IBM Plex Mono',fontSize:42,fontWeight:700,color:overallCompliance>=70?'var(--green)':overallCompliance>=50?'var(--yellow)':'var(--red)'}}, Math.round(overallCompliance)+'%'),
          div(null, {style:{fontSize:12,color:'var(--text3)'}}, 'Overall Rule Compliance')
        ),
        div(null, {style:{flex:1,display:'flex',gap:10,flexWrap:'wrap'}},
          ...[
            {l:'Disciplined Trades',v:disc.length,c:'var(--green)'},
            {l:'Indisciplined Trades',v:indisc.length,c:'var(--red)'},
            {l:'Avg P&L Disciplined',v:'Rs'+discPL.toFixed(0),c:discPL>=0?'var(--green)':'var(--red)'},
            {l:'Avg P&L Indisciplined',v:'Rs'+indiscPL.toFixed(0),c:indiscPL>=0?'var(--green)':'var(--red)'},
            {l:'FOMO Entries',v:fomoTrades.length,c:'var(--red)'},
            {l:'Avg FOMO P&L',v:'Rs'+fomoPL.toFixed(0),c:fomoPL>=0?'var(--green)':'var(--red)'},
          ].map(m=>div('mc',{key:m.l,style:{minWidth:120}},div('ml',null,m.l),div('mv',{style:{color:m.c,fontSize:16}},m.v)))
        )
      )
    ),

    // Most bypassed rules
    div(null, {style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginBottom:14}},
      div('card', null,
        div('ml', {style:{marginBottom:10}}, 'Most Bypassed Rules'),
        div(null, {style:{display:'flex',flexDirection:'column',gap:6}},
          ...sortedByBypass.slice(0,4).map(s=>div(null,{key:s.key,style:{padding:'8px 10px',background:'var(--bg3)',borderRadius:'var(--rs)',borderLeft:'3px solid var(--red)'}},
            div(null,{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}},
              span(null,{style:{fontSize:12,color:'var(--text)',fontWeight:600}},s.label),
              span(null,{style:{fontSize:11,fontFamily:'IBM Plex Mono',color:'var(--red)',fontWeight:700}},s.bypassed+' skipped')
            ),
            div(null,{style:{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text3)'}},
              span(null,null,'When followed: ',span(null,{style:{color:s.followedPL>=0?'var(--green)':'var(--red)',fontWeight:600}},'Rs'+s.followedPL.toFixed(0)+' avg')),
              span(null,null,'When bypassed: ',span(null,{style:{color:s.bypassedPL>=0?'var(--green)':'var(--red)',fontWeight:600}},'Rs'+s.bypassedPL.toFixed(0)+' avg'))
            )
          ))
        )
      ),
      div('card', null,
        div('ml', {style:{marginBottom:10}}, 'Most Followed Rules'),
        div(null, {style:{display:'flex',flexDirection:'column',gap:6}},
          ...sortedByFollowed.slice(0,4).map(s=>div(null,{key:s.key,style:{padding:'8px 10px',background:'var(--bg3)',borderRadius:'var(--rs)',borderLeft:'3px solid var(--green)'}},
            div(null,{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}},
              span(null,{style:{fontSize:12,color:'var(--text)',fontWeight:600}},s.label),
              span(null,{style:{fontSize:11,fontFamily:'IBM Plex Mono',color:'var(--green)',fontWeight:700}},Math.round(s.followRate)+'% followed')
            ),
            div(null,{style:{fontSize:11,color:'var(--text3)'}},
              'P&L impact of following: ',span(null,{style:{color:s.impact>=0?'var(--green)':'var(--red)',fontWeight:600}},(s.impact>=0?'+':'')+'Rs'+s.impact.toFixed(0)+' vs bypassing')
            )
          ))
        )
      )
    ),

    // Full rule compliance table
    div('card', null,
      div('ml', {style:{marginBottom:10}}, 'Full Rule Impact Analysis'),
      div('tov', null,
        h('table', null,
          h('thead', null, h('tr', null,
            ...['Rule','Followed','Bypassed','Follow Rate','Avg P&L (Followed)','Avg P&L (Bypassed)','Impact'].map(t=>h('th',{key:t},t))
          )),
          h('tbody', null, ...stats.map(s=>h('tr',{key:s.key},
            h('td',{style:{fontSize:12,color:'var(--text)',fontWeight:500}},s.label),
            h('td',{style:{fontSize:12,color:'var(--green)',fontFamily:'IBM Plex Mono'}},s.followed),
            h('td',{style:{fontSize:12,color:'var(--red)',fontFamily:'IBM Plex Mono'}},s.bypassed),
            h('td',null,div(null,{style:{display:'flex',alignItems:'center',gap:6}},
              div(null,{style:{flex:1,height:6,background:'var(--bg4)',borderRadius:3,overflow:'hidden'}},
                div(null,{style:{width:s.followRate+'%',height:'100%',background:s.followRate>=70?'var(--green)':s.followRate>=50?'var(--yellow)':'var(--red)',borderRadius:3}})
              ),
              span(null,{style:{fontSize:11,fontFamily:'IBM Plex Mono',color:s.followRate>=70?'var(--green)':s.followRate>=50?'var(--yellow)':'var(--red)',width:36,textAlign:'right'}},Math.round(s.followRate)+'%')
            )),
            h('td',{className:s.followedPL>=0?'pl-p':'pl-n'},'Rs'+s.followedPL.toFixed(0)),

// ── ANALYTICS TAB ──
function AnalyticsTab({eqTrades, optTrades, usTrades}) {
  const [period,setPeriod]=useState('ALL'),[cs,setCs]=useState(''),[ce,setCe]=useState('');
  const all=[...eqTrades,...optTrades];
  const closed=all.filter(t=>t.trade_result!=='OPEN'&&t.net_pl!=null);
  const totalPL=closed.reduce((a,t)=>a+(t.net_pl||0),0);
  const usPL=usTrades.reduce((a,t)=>a+(t.net_pl_inr||0),0);
  const wins=closed.filter(t=>t.trade_result==='PROFIT');
  const losses=closed.filter(t=>t.trade_result==='LOSS');
  const winRate=closed.length?(wins.length/closed.length*100).toFixed(1):0;
  const avgW=wins.length?wins.reduce((a,t)=>a+(t.net_pl||0),0)/wins.length:0;
  const avgL=losses.length?losses.reduce((a,t)=>a+(t.net_pl||0),0)/losses.length:0;
  const rr=avgL?Math.abs(avgW/avgL).toFixed(2):0;

              span(null,{style:{fontSize:11,color:'var(--text3)'}},s.move_type),
              s.ai_insight&&span(null,{style:{fontSize:10,color:'var(--accent2)',fontWeight:600}},'AI Analysed')
            ),
            s.notes&&div(null,{style:{fontSize:11,color:'var(--text3)',marginTop:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},s.notes)
          ),
          div(null,{style:{display:'flex',gap:4,flexShrink:0}},
            s.chart_5min&&span(null,{style:{fontSize:10,color:'var(--green)',fontWeight:700}},'5m\u2713'),
            s.chart_15min&&span(null,{style:{fontSize:10,color:'var(--accent)',fontWeight:700}},'15m\u2713')
          )
        );})
      )
    ),

  );
}

// ── EXPORT FUNCTIONS ──
function exportPDF(eq, opt, us, rules) {
  const all=[...eq,...opt];
  const closed=all.filter(t=>t.net_pl!=null&&t.trade_result!=='OPEN');
  const totalPL=closed.reduce((a,t)=>a+(t.net_pl||0),0);
  const usPL=us.reduce((a,t)=>a+(t.net_pl_inr||0),0);
  const wins=closed.filter(t=>t.trade_result==='PROFIT').length;
  const wr=closed.length?(wins/closed.length*100).toFixed(1):0;
  const now=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
  const eqR=eq.map(t=>'<tr><td>'+t.stock+'</td><td>'+(t.person||'Mahesh')+'</td><td>'+t.broker+'</td><td>'+t.buy_date+'</td><td>'+(t.sell_date||'Open')+'</td><td>'+t.quantity+'</td><td>'+t.buy_price+'</td><td>'+(t.sell_price||'—')+'</td><td>'+fmt(t.net_pl)+'</td><td>'+(t.trade_rating||'—')+'</td></tr>').join('');
  const optR=opt.map(t=>'<tr><td>'+t.stock+'</td><td>'+t.option_type+' '+t.strike+'</td><td>'+t.setup_type+'</td><td>'+t.buy_date+'</td><td>'+(t.sell_date||'Open')+'</td><td>'+t.quantity+'</td><td>'+t.buy_price+'</td><td>'+(t.sell_price||'—')+'</td><td>'+fmt(t.net_pl)+'</td><td>'+(t.trade_rating||'—')+'</td></tr>').join('');
  const usR=us.map(t=>'<tr><td>'+t.ticker+'</td><td>'+(t.company_name||'')+'</td><td>'+t.buy_date+'</td><td>'+(t.sell_date||'Open')+'</td><td>'+t.quantity+'</td><td>$'+t.buy_price_usd+'</td><td>'+(t.sell_price_usd?'$'+t.sell_price_usd:'—')+'</td><td>'+fmtUSD(t.net_pl_usd)+'</td><td>'+fmt(t.net_pl_inr)+'</td><td>'+(t.trade_rating||'—')+'</td></tr>').join('');
  const rulesR=(rules||[]).map(r=>'<tr><td>'+r.rule_text+'</td><td>'+r.category+'</td><td>'+r.status+'</td></tr>').join('');
  const html='<!DOCTYPE html><html><head><meta charset=UTF-8><title>JournalX Report</title><style>body{font-family:Arial,sans-serif;padding:24px;color:#111}h1{font-size:19px;margin-bottom:4px}h2{font-size:14px;margin:20px 0 7px;border-bottom:2px solid #eee;padding-bottom:4px}.s{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.m{background:#f8faff;border:1px solid #eee;border-radius:6px;padding:9px 14px}.ml{font-size:10px;text-transform:uppercase;color:#6b7280;margin-bottom:2px}.mv{font-size:16px;font-weight:700;font-family:monospace}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#f3f4f6;padding:6px;text-align:left;font-size:10px;text-transform:uppercase;color:#6b7280;border-bottom:2px solid #eee}td{padding:5px 6px;border-bottom:1px solid #f0f0f0}</style></head><body><h1>JournalX Report</h1><p style=color:#6b7280;font-size:12px>Generated '+now+'</p><div class=s><div class=m><div class=ml>India P&L</div><div class=mv>'+fmt(totalPL)+'</div></div><div class=m><div class=ml>US P&L INR</div><div class=mv>'+fmt(usPL)+'</div></div><div class=m><div class=ml>Grand Total</div><div class=mv>'+fmt(totalPL+usPL)+'</div></div><div class=m><div class=ml>Win Rate</div><div class=mv>'+wr+'%</div></div><div class=m><div class=ml>Total Trades</div><div class=mv>'+(all.length+us.length)+'</div></div></div><h2>Momentum Portfolio ('+eq.length+')</h2><table><tr><th>Stock</th><th>Person</th><th>Broker</th><th>Buy</th><th>Sell</th><th>Qty</th><th>Buy</th><th>Sell</th><th>P&L</th><th>Rating</th></tr>'+(eqR||'<tr><td colspan=10 style=text-align:center;color:#9ca3af>No trades</td></tr>')+'</table><h2>Options Buying ('+opt.length+')</h2><table><tr><th>Stock</th><th>Type</th><th>Setup</th><th>Buy</th><th>Sell</th><th>Qty</th><th>Buy</th><th>Sell</th><th>P&L</th><th>Rating</th></tr>'+(optR||'<tr><td colspan=10 style=text-align:center;color:#9ca3af>No trades</td></tr>')+'</table><h2>US Portfolio ('+us.length+')</h2><table><tr><th>Ticker</th><th>Company</th><th>Buy</th><th>Sell</th><th>Qty</th><th>Buy$</th><th>Sell$</th><th>USD</th><th>INR</th><th>Rating</th></tr>'+(usR||'<tr><td colspan=10 style=text-align:center;color:#9ca3af>No trades</td></tr>')+'</table><h2>Strategy Rules ('+(rules||[]).length+')</h2><table><tr><th>Rule</th><th>Category</th><th>Status</th></tr>'+(rulesR||'<tr><td colspan=3>No rules</td></tr>')+'</table></body></html>';
  const w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(()=>w.print(),600);
}

function exportExcel(eq, opt, us, rules) {
  const esc=v=>{const s=String(v==null?'':v);return(s.includes(',')||s.includes('"')||s.includes('\n'))?'"'+s.replace(/"/g,'""')+'"':s;};
  const row=arr=>arr.map(esc).join(',')+'\n';
  const all=[...eq,...opt],closed=all.filter(t=>t.net_pl!=null&&t.trade_result!=='OPEN');
  const tpl=closed.reduce((a,t)=>a+(t.net_pl||0),0),upl=us.reduce((a,t)=>a+(t.net_pl_inr||0),0);
  const wr=closed.length?(closed.filter(t=>t.trade_result==='PROFIT').length/closed.length*100).toFixed(1):0;
  const sheets=[
    {name:'Summary',data:'Metric,Value\nIndia P&L,'+tpl+'\nUS P&L INR,'+upl+'\nGrand Total,'+(tpl+upl)+'\nWin Rate,'+wr+'%\nTotal Trades,'+(all.length+us.length)+'\n'},
    {name:'Momentum_Portfolio',data:row(['Stock','Person','Broker','Buy Date','Sell Date','Qty','Buy Price','Sell Price','Net PL','Result','Rating'])+eq.map(t=>row([t.stock,t.person||'Mahesh',t.broker,t.buy_date,t.sell_date||'',t.quantity,t.buy_price,t.sell_price||'',t.net_pl||'',t.trade_result,t.trade_rating||''])).join('')},
    {name:'Options_Buying',data:row(['Stock','Type','Strike','Expiry','Setup','Buy Date','Sell Date','Qty','Buy','Sell','Net PL','Result','Rating'])+opt.map(t=>row([t.stock,t.option_type,t.strike,t.expiry_month,t.setup_type,t.buy_date,t.sell_date||'',t.quantity,t.buy_price,t.sell_price||'',t.net_pl||'',t.trade_result,t.trade_rating||''])).join('')},
    {name:'US_Portfolio',data:row(['Ticker','Company','Buy Date','Sell Date','Qty','Buy USD','Sell USD','PL USD','PL INR','Result','Rating'])+us.map(t=>row([t.ticker,t.company_name||'',t.buy_date,t.sell_date||'',t.quantity,t.buy_price_usd,t.sell_price_usd||'',t.net_pl_usd||'',t.net_pl_inr||'',t.trade_result,t.trade_rating||''])).join('')},
    {name:'Strategy_Rules',data:row(['Rule','Category','Status','Source'])+(rules||[]).map(r=>row([r.rule_text,r.category,r.status,r.source])).join('')}
  ];
  sheets.forEach((s,i)=>{setTimeout(()=>{const blob=new Blob(['\uFEFF'+s.data],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='JournalX_'+s.name+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);},i*400);});
}

// ── API KEY MODAL ──
function ApiKeyModal({onClose}) {
  const [key, setKey] = useState(localStorage.getItem('claude_api_key')||'');
  const [show, setShow] = useState(false);
  const save = () => {
    if (key.trim()) {
      localStorage.setItem('claude_api_key', key.trim());
      alert('API key saved! All AI features are now active.');
      onClose();
      window.location.reload();
    }
  };
  const remove = () => {
    localStorage.removeItem('claude_api_key');
    alert('API key removed. AI features disabled.');
    onClose();
    window.location.reload();
  };
  return div('ov', {onClick:e=>e.target===e.currentTarget&&onClose()},
    div('mod mod-sm', null,
      div('mh', null,
        span('mt', null, '🤖 Claude API Key Setup'),
        btn('mc2', {onClick:onClose}, 'x')
      ),
      div('mb', null,
        div(null, {style:{fontSize:13,color:'var(--text2)',marginBottom:14,lineHeight:1.8}},
          'Your API key is stored only in this browser. It is never sent anywhere except directly to Anthropic for AI features.',
          h('br'),
          h('br'),
          'Get your key from: ',
          h('a', {href:'https://platform.anthropic.com/settings/keys',target:'_blank',style:{color:'var(--accent)'}}, 'platform.anthropic.com/settings/keys')
        ),
        div('f', null,
          h('label', null, 'Anthropic API Key'),
          div(null, {style:{position:'relative'}},
            h('input', {
              type: show?'text':'password',
              value: key,
              onChange: e=>setKey(e.target.value),
              placeholder: 'sk-ant-api03-...',
              style:{width:'100%',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:'var(--rs)',padding:'8px 36px 8px 10px',fontSize:13,color:'var(--text)',fontFamily:'monospace',outline:'none'}
            }),
            btn(null, {onClick:()=>setShow(v=>!v), style:{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'var(--text3)',fontSize:14}}, show?'🙈':'👁️')
          )
        ),
        localStorage.getItem('claude_api_key') && div(null,{style:{marginTop:10,padding:'8px 10px',background:'rgba(16,185,129,.1)',border:'1px solid rgba(16,185,129,.3)',borderRadius:'var(--rs)',fontSize:12,color:'var(--green)'}},'✓ API key is currently active — AI features are enabled')
      ),
      div('mf', null,
        localStorage.getItem('claude_api_key') && btn('btn btn-r btn-sm', {onClick:remove}, 'Remove Key'),
        btn('btn btn-g', {onClick:onClose}, 'Cancel'),
        btn('btn btn-p', {onClick:save}, 'Save Key ✓')
      )
    )
  );
}

// ── APP ──
function App() {
  const [theme,setTheme]=useState(()=>localStorage.getItem('jx_theme')||'dark');
  const [authed,setAuthed]=useState(()=>localStorage.getItem('jx_auth')==='1');
  const [tab,setTab]=useState('analytics');
  const [showCfg,setShowCfg]=useState(false);
  const [isLive,setIsLive]=useState(true);
  const [eqTrades,setEqTrades]=useState(initSupa()?[]:DEMO_EQ);
  const [optTrades,setOptTrades]=useState(initSupa()?[]:DEMO_OPT);
  const [usTrades,setUsTrades]=useState(initSupa()?[]:DEMO_US);
  const [chartSessions,setChartSessions]=useState([]);
  const [rules,setRules]=useState(()=>PRELOADED_RULES.map((r,i)=>({...r,id:'pr_'+i})));
  const [loading,setLoading]=useState(false);
  const [showApiSetup,setShowApiSetup]=useState(false);

  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('jx_theme',theme);},[theme]);



  const loadFromSupa=async()=>{
    setLoading(true);
    const [eq,opt,us]=await Promise.all([dbLoad('equity'),dbLoad('options'),dbLoad('us')]);
    if(eq!==null)setEqTrades(eq);
    if(opt!==null)setOptTrades(opt);
    if(us!==null)setUsTrades(us);
    setLoading(false);
  };

  useEffect(()=>{
    loadFromSupa();
  },[]);

  const saveCfg=async(url,key)=>{
    if(url&&key){localStorage.setItem('supa_url',url);localStorage.setItem('supa_key',key);supa=window.supabase.createClient(url,key);setIsLive(true);await loadFromSupa();}
    setShowCfg(false);
  };

  if(!authed)return h(LoginScreen,{onLogin:()=>setAuthed(true)});

  const TABS=[{id:'analytics',label:'Analytics'},{id:'equity',label:'Momentum Portfolio'},{id:'options',label:'Options Buying'},{id:'us',label:'US Portfolio'},{id:'charts',label:'Charts & Rules'}];

  return div('',{id:'app'},
    div('topbar',null,
      div('logo',null,span(null,{style:{fontFamily:'IBM Plex Mono',fontSize:16,fontWeight:700,color:'var(--accent)'}},'JournalX')),
      div('tr',null,
        !isLive&&btn('btn btn-g btn-sm',{onClick:()=>setShowCfg(true)},'Connect Supabase'),
        isLive&&span(null,{style:{fontSize:11,color:'var(--green)',display:'flex',alignItems:'center',gap:5}},span(null,{style:{width:6,height:6,borderRadius:'50%',background:'var(--green)',display:'inline-block'}}),'Live'),
        btn('btn btn-g btn-sm',{onClick:()=>exportPDF(eqTrades,optTrades,usTrades,rules)},'PDF'),
        btn('btn btn-g btn-sm',{onClick:()=>exportExcel(eqTrades,optTrades,usTrades,rules)},'Excel'),
        div('thsw',null,
          ...[ ['dark','🌑'],['midnight','🌊'],['light','☀️'] ].map(([t,e])=>btn('thbtn'+(theme===t?' active':''),{key:t,onClick:()=>setTheme(t),title:t},e))
        ),
        div(null,{style:{display:'flex',alignItems:'center',gap:6}},
          div(null,{style:{width:26,height:26,borderRadius:'50%',background:'linear-gradient(135deg,var(--accent),var(--accent2))',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#fff'}},'M'),
          span(null,{style:{fontSize:13,color:'var(--text2)'}},'Mahesh')
        ),
        btn('btn btn-g btn-sm',{onClick:()=>{localStorage.removeItem('jx_auth');setAuthed(false);}},'Lock'),
        showApiSetup&&h(ApiKeyModal,{onClose:()=>setShowApiSetup(false)}),
        btn('btn btn-g btn-sm',{onClick:()=>setShowApiSetup(true),style:{background:localStorage.getItem('claude_api_key')?'rgba(16,185,129,.12)':'rgba(245,158,11,.12)',color:localStorage.getItem('claude_api_key')?'var(--green)':'var(--yellow)',border:'1px solid '+(localStorage.getItem('claude_api_key')?'rgba(16,185,129,.3)':'rgba(245,158,11,.3)')}},localStorage.getItem('claude_api_key')?'🤖 AI On':'🤖 AI Key')
      )
    ),
    div('tabs',null,...TABS.map(t=>div('tab'+(tab===t.id?' active':''),{key:t.id,onClick:()=>setTab(t.id)},t.label))),
    div('main',null,
      loading&&div(null,{style:{textAlign:'center',padding:'40px 0',color:'var(--text3)'}},'Loading trades from Supabase...'),
      !loading&&div(null,null,
        !isLive&&div('cb',null,span(null,null,'⚠️'),span(null,null,'Demo mode — trades will not persist. ',h('a',{onClick:()=>setShowCfg(true),style:{color:'var(--yellow)',textDecoration:'underline',cursor:'pointer'}},'Connect Supabase'),' to save your trades.')),
        tab==='analytics'&&h(AnalyticsTab,{eqTrades,optTrades,usTrades}),
        tab==='equity'&&h(EquityTab,{trades:eqTrades,setTrades:setEqTrades,isLive}),
        tab==='options'&&h(OptionsTab,{trades:optTrades,setTrades:setOptTrades,isLive}),
        tab==='us'&&h(USTab,{trades:usTrades,setTrades:setUsTrades,isLive}),
        tab==='charts'&&h(ChartsTab,{sessions:chartSessions,setSessions:setChartSessions,rules,setRules})
      )
    ),
    showCfg&&h(ConfigModal,{onSave:saveCfg})
  );
}

window.addEventListener('load', function() { ReactDOM.createRoot(document.getElementById('root')).render(h(App)); });

</script>
